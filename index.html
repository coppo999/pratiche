<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pratiche">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
<link rel="icon" href="icon-192.png?v=2">
<title>Pratiche Studio</title>
<style>
:root{--navy:#1F3864;--navy2:#2b4f8c;--gold:#C9A84C;--bg:#f2f4f8;--panel:#fff;--panel2:#f6f7fb;--line:#e3e7ef;--text:#1b2433;--muted:#6b7588;--accent:#2563eb;--bad:#c0362c;--ok:#059669;--r:14px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1520;--panel:#171f2d;--panel2:#1d2738;--line:#2a3548;--text:#e8edf6;--muted:#93a0b6;--accent:#6ea0ff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.hdr{position:sticky;top:0;z-index:20;background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:calc(var(--st) + 10px) 16px 12px}
.hdr .row{display:flex;align-items:center;gap:10px}
.hdr h1{font-size:19px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .sub{font-size:13px;color:#cfdaf0;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:38px;height:38px;border-radius:11px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;flex:none;cursor:pointer}
.ib svg{width:19px;height:19px}
.search{margin-top:10px;display:flex;gap:8px}
.search input{flex:1;min-width:0;border:0;border-radius:12px;padding:10px 12px;background:rgba(255,255,255,.95);color:#1b2433;font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
main{padding:8px 12px calc(84px + var(--sb))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.card h3{margin:0 0 8px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.pr{display:flex;gap:11px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;cursor:pointer}
.pr:active{transform:scale(.99)}
.cod{flex:none;min-width:58px;text-align:center;border-radius:10px;padding:7px 6px;font-weight:800;font-size:13.5px;color:#fff;background:var(--cc,#64748b)}
.pr .tx{flex:1;min-width:0}
.pr b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{flex:none;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;color:var(--sc);background:color-mix(in srgb,var(--sc) 14%,transparent);max-width:96px;text-align:center}
.more{text-align:center;color:var(--muted);padding:14px;font-size:13px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--panel);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--sb))}
.tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);padding:4px;cursor:pointer}
.tabbar button svg{width:23px;height:23px}
.tabbar button.on{color:var(--navy)}
@media (prefers-color-scheme:dark){.tabbar button.on{color:var(--gold)}}
.tabbar .plus{color:#fff!important}
.tabbar .plus span.pl{width:44px;height:44px;border-radius:14px;background:var(--gold);display:grid;place-items:center;margin-top:-18px;box-shadow:0 6px 16px rgba(201,168,76,.45)}
.tabbar .plus{color:var(--muted)!important}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px;margin:12px 0 4px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.act{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:8px 4px;text-decoration:none;cursor:pointer}
.act svg{width:20px;height:20px}
.act.off{opacity:.35;pointer-events:none}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.f label{font-size:12.5px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:10px 11px;font-size:16px}
.f textarea{resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 14px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--text)}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1b2433}
.btn.bad{color:var(--bad)}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2 .btn{flex:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-word}
.stbar{display:flex;gap:8px;align-items:center}
.stbar .dot{width:12px;height:12px;border-radius:50%;flex:none}
.stbar select{flex:1}
.ok{font-size:12px;color:var(--ok);min-height:16px;margin-top:2px}
.crumbs{display:flex;gap:4px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:4px 0 8px}
.crumbs a{text-decoration:none;font-weight:600}
.fl{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fi{display:flex;align-items:center;gap:11px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;text-decoration:none;color:var(--text)}
.fi:last-child{border-bottom:0}
.fi .ic{width:38px;height:38px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#fff;background:#64748b;overflow:hidden;background-size:cover;background-position:center}
.fi .ic.dir{background:#e8b33c}
.fi .tx{flex:1;min-width:0}
.fi b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.fi small{color:var(--muted);font-size:12px}
.fi .mn{flex:none;width:34px;height:34px;border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer}
.up{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.dia{display:flex;flex-direction:column;gap:0}
.de{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.de:last-child{border-bottom:0}
.de i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;flex:none;font-size:12px;color:var(--navy)}
.de small{display:block;color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(92px + var(--sb));transform:translateX(-50%);background:#1b2433;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:99;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}.toast.err{background:var(--bad)}
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:60;display:flex;align-items:flex-end}
.sheet{background:var(--panel);width:100%;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + var(--sb));max-height:88vh;overflow:auto}
.sheet h2{font-size:16px;margin:2px 4px 12px}
.sheet .opt{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:13px 6px;font-size:16px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;color:var(--text)}
.sheet .opt:last-child{border-bottom:0}
.sheet .opt svg{width:20px;height:20px;color:var(--muted)}
.sheet .opt.bad{color:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.spin{display:inline-block;width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,var(--navy),#14254a)}
.login{background:var(--panel);border-radius:20px;padding:26px 22px;max-width:420px;width:100%;text-align:center}
.login h1{margin:8px 0 4px;font-size:22px;color:var(--navy)}
@media (prefers-color-scheme:dark){.login h1{color:var(--gold)}}
.login p{color:var(--muted);font-size:14px}
.logo{width:64px;height:64px;border-radius:18px;background:var(--navy);display:grid;place-items:center;margin:0 auto;color:var(--gold);font-weight:800;font-size:22px}
code{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-size:12.5px;word-break:break-all}
.pv{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--sc);border-radius:var(--r);padding:12px;margin:8px 0}
.pv .t{display:flex;justify-content:space-between;gap:8px}
.pv .t b{font-size:15px}
.pv .s{color:var(--muted);font-size:13px;margin:2px 0 8px}
.voce{display:grid;grid-template-columns:1fr 92px 34px;gap:6px;margin-bottom:6px}
.voce input{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px;font-size:15px;width:100%}
.voce button{border:0;background:none;color:var(--bad);font-size:18px}
.tot{display:flex;justify-content:space-between;font-weight:700;margin:8px 0}
.warn{background:color-mix(in srgb,#f59e0b 14%,transparent);border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0}
.prog{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--accent);width:0}
.hint{font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script>
"use strict";
/* ================= Pratiche Studio · versione per il telefono =================
   Legge e scrive direttamente nella cartella OneDrive\Lavoro tramite Microsoft Graph.
   Stessi file del programma sul PC: <anno>/<cartella pratica>/_pratica.json,
   _Preventivi/_preventivi.json, _pratiche_per_contabilita.json, _sync/numeri_contabilita.json */

/* ---------- utilità ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const camel = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9 ]+/g, " ").trim().split(/\s+/).filter(Boolean).map(w => w[0].toUpperCase() + w.slice(1)).join("");
const safeName = s => String(s || "").replace(/[\\/:*?"<>|#%]+/g, "-").replace(/\s+/g, " ").trim().replace(/[. ]+$/, "");
const num = v => { const n = parseFloat(String(v ?? "").replace(/\./g, "").replace(",", ".")); return isFinite(n) ? n : 0; };
const eur = n => (+n || 0).toLocaleString("it-IT", { style: "currency", currency: "EUR" });
const oggi = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const dataIt = s => { if (!s) return ""; const d = new Date(s.length === 10 ? s + "T12:00:00" : s); return isNaN(d) ? s : d.toLocaleDateString("it-IT", { day: "2-digit", month: "2-digit", year: "numeric" }); };
const dataOra = s => { const d = new Date(s); return isNaN(d) ? "" : d.toLocaleString("it-IT", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }); };
const titleCase = s => String(s || "").toLowerCase().replace(/(^|[\s'’(\-\/])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());
const natCmp = (a, b) => a.localeCompare(b, "it", { numeric: true, sensitivity: "base" });
const sleep = ms => new Promise(r => setTimeout(r, ms));
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
let toastT;
function toast(t, err) { const e = $("#toast"); e.textContent = t; e.className = "toast on" + (err ? " err" : ""); clearTimeout(toastT); toastT = setTimeout(() => e.className = "toast", err ? 4500 : 2600); }
const fmtSize = n => n == null ? "" : n < 1024 ? n + " B" : n < 1048576 ? Math.round(n / 1024) + " KB" : (n / 1048576).toFixed(1) + " MB";

const I = {
  list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  euro: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 6.5A7 7 0 1 0 17 17.5"/><path d="M4 10h9M4 14h9"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',
  chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.6A8.4 8.4 0 1 1 21 11.5z"/></svg>',
  mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
  map: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  cam: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>',
  fold: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v5M9.5 13.5h5"/></svg>',
  ext: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>',
  eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>',
  ref: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.8-3.4L23 10M1 14l4.7 4.4A9 9 0 0 0 20.5 15"/></svg>',
  cog: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 1.2 14H1a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 2.6 7a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 9 1.2V1a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
};

/* ---------- stesse tabelle del programma sul PC ---------- */
const STATI = { attesa: "In attesa di conferma", in_corso: "In corso", attesa_pagamento: "In attesa di pagamento", fattura_inviata: "Fattura inviata", nota_inviata: "Nota di pagamento inviata", pagata: "Conclusa e pagata", sospesa: "Sospesa", conclusa: "Conclusa", non_eseguita: "Non eseguita" };
const STATI_BREVI = { attesa: "Da confermare", in_corso: "In corso", attesa_pagamento: "Da pagare", fattura_inviata: "Fattura inviata", nota_inviata: "Nota inviata", pagata: "Pagata", sospesa: "Sospesa", conclusa: "Conclusa", non_eseguita: "Non eseguita" };
const STATI_VECCHI = { aperta: "attesa", depositata: "in_corso", integrazione: "in_corso", annullata: "non_eseguita" };

const D = { prat: [], byKey: {}, exp: {}, expAgg: "", cont: { stati: {}, numeri: [], agg: "" }, prev: null, prevTag: null, caricato: false, errore: "" };

function parseDirName(year, name) {

  if (!m) return { anno: +year, num: 0, codice: "", dir: name, key: `${year}/${name}`, cat: catOf(name), legacy };
  return { anno: +year, num: +m[1], codice: `${+m[1]}-${m[2]}`, dir: name, key: `${year}/${name}`, cat: catOf(name), legacy };
}
function baseMeta(p) {

function diarioUnisci(m, tipo, ev, minuti) {
  const L = m.diario || [], last = L[L.length - 1];
  if (last && last.tipo === tipo && Date.now() - Date.parse(last.t) < minuti * 60e3) { m.diario = [...L.slice(0, -1), { ...last, ev, t: new Date().toISOString() }]; return; }

}
/* modifica sicura: rilegge il file, applica la modifica e salva solo se nessun altro l'ha cambiato nel frattempo */
async function modificaMeta(p, fn) {
  const parts = [String(p.anno), p.dir, "_pratica.json"];
  for (let t = 0; t < 4; t++) {
    const r = await readJSON(parts);
    const m = r ? JSON.parse(JSON.stringify(r.data)) : baseMeta(p);
    delete m._fromScheda;
    if (!m.codice && p.codice) m.codice = p.codice; if (!m.anno) m.anno = p.anno;

  app().innerHTML = `<header class="hdr"><div class="row"><h1>Pratiche</h1><button class="ib" id="l-ref" title="Aggiorna">${I.ref}</button><button class="ib" id="l-cfg" title="Impostazioni">${I.cog}</button></div>

    <div class="chips" id="l-f">${[["aperte", "Aperte"], ["dapagare", "Da pagare"], ["tutte", "Tutte"]].map(([k, l]) => `<button class="chip ${UI.filtro === k ? "on" : ""}" data-f="${k}">${l}</button>`).join("")}
      ${anni.map(a => `<button class="chip ${String(UI.anno) === String(a) ? "on" : ""}" data-a="${a}">${a}</button>`).join("")}</div>

  wireTabbar();

  $$("#l-f [data-f]").forEach(b => b.onclick = () => { UI.filtro = b.dataset.f; salvaUI(); listaN = 60; viewLista(); });
  $$("#l-f [data-a]").forEach(b => b.onclick = () => { UI.anno = String(UI.anno) === b.dataset.a ? "" : b.dataset.a; salvaUI(); listaN = 60; viewLista(); });
  $("#l-ref").onclick = async () => { $("#l-ref").innerHTML = `<span class="spin"></span>`; await caricaTutto(); viewLista(); toast("Elenco aggiornato da OneDrive"); };
  $("#l-cfg").onclick = impostazioni;
  disegnaLista();
}
function filtrate() {
  const toks = norm(UI.q).split(/\s+/).filter(Boolean);
  return D.prat.filter(p => {
    if (UI.anno && String(p.anno) !== String(UI.anno)) return false;
    const st = statoOf(p);
    if (UI.filtro === "aperte" && ST_CHIUSI.includes(st)) return false;
    if (UI.filtro === "dapagare" && !ST_DAPAGARE.includes(st)) return false;
    if (!toks.length) return true;
    const m = metaOf(p); const h = norm([p.codice, p.dir, m.committente, m.comune, m.indirizzo, m.tipo, m.canale, m.notaBreve].join(" "));
    return toks.every(k => h.includes(k));
  });
}
function rigaPratica(p) {
  const m = metaOf(p), st = statoOf(p);
  const tit = m.committente ? titleCase(m.committente) : p.dir.replace(/^\d+-\d+_?/, "").replace(/[-_]+/g, " ");
  const sub = [m.tipo, [m.indirizzo, m.comune].filter(Boolean).map(titleCase).join(", ")].filter(Boolean).join(" · ") || p.dir;
  return `<div class="pr" data-k="${esc(p.key)}"><span class="cod" style="--cc:${CATCOL[p.cat] || CATCOL.altro}">${esc(p.codice || "—")}</span>
    <div class="tx"><b>${esc(tit)}</b><small>${esc(sub)}</small>${m.notaBreve ? `<small>✎ ${esc(m.notaBreve)}</small>` : ""}</div>
    ${st ? `<span class="st" style="--sc:${ST_COL[st] || "#94a3b8"}">${esc(STATI_BREVI[st] || st)}</span>` : ""}</div>`;
}
function disegnaLista() {
  const L = filtrate(), el = $("#l-l"); if (!el) return;
  $("#l-err").innerHTML = D.errore ? `<div class="warn">${esc(D.errore)}</div>` : "";
  if (!D.prat.length) { el.innerHTML = `<div class="empty">${D.caricato ? "Nessuna pratica trovata" : `<span class="spin"></span> Leggo le pratiche da OneDrive…`}</div>`; $("#l-more").textContent = ""; return; }
  el.innerHTML = L.slice(0, listaN).map(rigaPratica).join("") || `<div class="empty">Nessuna pratica con questi filtri</div>`;
  $$(".pr", el).forEach(r => r.onclick = () => { location.hash = "#/p/" + encodeURIComponent(r.dataset.k); });
  const more = $("#l-more");
  if (L.length > listaN) { more.textContent = `Altre ${L.length - listaN}…`; new IntersectionObserver((en, o) => { if (en[0].isIntersecting) { o.disconnect(); listaN += 80; disegnaLista(); } }).observe(more); }
  else more.textContent = L.length ? `${L.length} pratiche` : "";
}
function impostazioni() {
  sheet("Impostazioni", `<p class="hint" style="margin:0 4px 10px">Cartella su OneDrive: <b>${esc(CFG.root)}</b><br>Indirizzo dell'app: <code>${esc(REDIRECT)}</code></p>
    <button class="opt" data-a="cfg">${I.cog}Cambia ID applicazione o cartella</button>
    <button class="opt" data-a="gk">${I.edit}Chiave Gemini (lettura documenti)${ls.get("ps_gkey", "") ? " ✓" : ""}</button>
    <button class="opt bad" data-a="out">${I.ext}Esci dall'account Microsoft</button>`, (bg, close) => {
    $("[data-a=cfg]", bg).onclick = () => { close(); viewSetup(); };

    $("[data-a=out]", bg).onclick = () => { close(); logout(); };

/* ---------- pratica ---------- */
let PCUR = { key: "", tab: "doc", sub: [], meta: null, files: null, filesAt: 0 };
async function viewPratica(key, tab) {
  const p = D.byKey[key];
  if (!p) { app().innerHTML = `<div class="empty" style="padding-top:80px">Pratica non trovata.<br><br><a href="#/">Torna all'elenco</a></div>`; return; }
  if (PCUR.key !== key) PCUR = { key, tab: tab || PCUR.tab || "doc", sub: [], meta: null, files: null, filesAt: 0 };
  const m = metaOf(p);
  disegnaPratica(p, m);
  try { PCUR.meta = await leggiMeta(p); if (PCUR.key === key) disegnaPratica(p, PCUR.meta); }
  catch (e) { toast("Non riesco a leggere la scheda: " + e.message, true); }
}
function disegnaPratica(p, m) {
  const st = statoOf(p);
  const tel = String(m.telefono || "").replace(/[^\d+]/g, ""), wa = tel ? (tel.startsWith("+") ? tel.slice(1) : tel.startsWith("00") ? tel.slice(2) : "39" + tel) : "";
  const dove = [m.indirizzo, m.comune, m.provincia].filter(Boolean).join(", ");
  app().innerHTML = `<header class="hdr"><div class="row"><button class="ib" id="p-back">${I.back}</button><div style="flex:1;min-width:0"><h1>Pratica ${esc(p.codice || p.dir)}</h1>
      <div class="sub">${esc([m.committente && titleCase(m.committente), m.tipo].filter(Boolean).join(" · ") || p.dir)}</div></div></div>
    <div class="acts"><a class="act ${tel ? "" : "off"}" href="tel:${esc(tel)}">${I.phone}Chiama</a><a class="act ${wa ? "" : "off"}" href="https://wa.me/${esc(wa)}" target="_blank" rel="noopener">${I.chat}WhatsApp</a>
      <a class="act ${m.email ? "" : "off"}" href="mailto:${esc(m.email || "")}">${I.mail}E-mail</a><a class="act ${dove ? "" : "off"}" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(dove)}" target="_blank" rel="noopener">${I.map}Mappa</a></div></header>
    <main>
      <div class="card"><div class="stbar"><span class="dot" id="p-dot" style="background:${ST_COL[st] || "#94a3b8"}"></span>
        <select id="p-st" class="f" style="margin:0;border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:10px;font-size:16px">${Object.entries(STATI).map(([k, l]) => `<option value="${k}" ${st === k ? "selected" : ""}>${esc(l)}</option>`).join("")}${st ? "" : `<option value="" selected>Imposta stato…</option>`}</select></div>
        <div class="f" style="margin:10px 0 0"><input id="p-nt" placeholder="Nota: es. inviata in Comune il 12/10 – prot. 12345" value="${esc(m.notaBreve || "")}"></div><div class="ok" id="p-ok"></div></div>
      <div class="seg" id="p-tabs">${[["doc", "Documenti"], ["dati", "Dati"], ["diario", "Diario"]].map(([k, l]) => `<button data-t="${k}" class="${PCUR.tab === k ? "on" : ""}">${l}</button>`).join("")}</div>
      <div id="p-body"></div></main>${tabbar("p")}`;
  wireTabbar();
  $("#p-back").onclick = () => { if (history.length > 1 && document.referrer !== "x") history.back(); else location.hash = "#/"; };
  const ok = t => { const o = $("#p-ok"); if (o) { o.textContent = t; setTimeout(() => { if (o.textContent === t) o.textContent = ""; }, 3500); } };
  $("#p-st").onchange = async e => {
    const v = e.target.value; ok("Salvo…");
    try { PCUR.meta = await modificaMeta(p, mm => { mm.stato = v; mm.statoAgg = new Date().toISOString(); diarioPush(mm, "Stato: " + (STATI[v] || v) + " (dal telefono)", "stato", { st: v }); });
      $("#p-dot").style.background = ST_COL[v] || "#94a3b8"; ok("✓ Stato salvato · va in Contabilità alla prossima sincronizzazione"); if (PCUR.tab === "diario") disegnaTab(p); }
    catch (er) { ok(""); toast("Non salvato: " + er.message, true); }
  };
  let nt;
  const salvaNota = async () => {
    const v = $("#p-nt").value.trim(); ok("Salvo…");
    try { PCUR.meta = await modificaMeta(p, mm => { mm.notaBreve = v; mm.notaAgg = new Date().toISOString(); diarioUnisci(mm, "nota", v ? "Nota: " + v : "Nota cancellata", 30); }); ok("✓ Nota salvata"); }
    catch (er) { ok(""); toast("Nota non salvata: " + er.message, true); }
  };
  $("#p-nt").oninput = () => { clearTimeout(nt); nt = setTimeout(salvaNota, 1200); };
  $("#p-nt").onkeydown = e => { if (e.key === "Enter") { clearTimeout(nt); salvaNota(); e.target.blur(); } };
  $$("#p-tabs button").forEach(b => b.onclick = () => { PCUR.tab = b.dataset.t; $$("#p-tabs button").forEach(x => x.classList.toggle("on", x === b)); disegnaTab(p); });
  disegnaTab(p);
}
function disegnaTab(p) {
  const body = $("#p-body"); if (!body) return;
  if (PCUR.tab === "dati") return tabDati(p, body);
  if (PCUR.tab === "diario") return tabDiario(p, body);
  return tabDoc(p, body);
}

/* documenti */
const ICON_EXT = { pdf: ["PDF", "#dc2626"], p7m: ["P7M", "#be123c"], doc: ["DOC", "#2563eb"], docx: ["DOC", "#2563eb"], xls: ["XLS", "#15803d"], xlsx: ["XLS", "#15803d"], dwg: ["DWG", "#b45309"], dxf: ["DXF", "#b45309"], jpg: ["JPG", "#7c3aed"], jpeg: ["JPG", "#7c3aed"], png: ["PNG", "#7c3aed"], heic: ["HEIC", "#7c3aed"], zip: ["ZIP", "#475569"], xml: ["XML", "#0d9488"], txt: ["TXT", "#64748b"], msg: ["MSG", "#0369a1"], eml: ["EML", "#0369a1"] };
const extOf = n => { const m = /\.([^.]+)$/.exec(n); return m ? m[1].toLowerCase() : ""; };
const apribile = n => /\.(pdf|jpe?g|png|gif|webp|heic|txt|mp4|mov)$/i.test(n);
async function tabDoc(p, body) {
  const parts = [String(p.anno), p.dir, ...PCUR.sub];
  const crumbs = [`<a href="#" data-c="0">${esc(p.codice || "Pratica")}</a>`, ...PCUR.sub.map((s, i) => `<a href="#" data-c="${i + 1}">${esc(s)}</a>`)].join(" › ");
  body.innerHTML = `<div class="crumbs">${crumbs}</div>
    <div class="up"><label class="btn gold">${I.cam}Scatta foto<input type="file" accept="image/*" capture="environment" id="d-cam" hidden></label>
      <label class="btn">${I.up}Carica file<input type="file" multiple id="d-up" hidden></label></div>
    <div id="d-prog"></div><div class="fl" id="d-l"><div class="empty"><span class="spin"></span> Carico i file…</div></div>
    <div class="row2" style="margin-top:10px"><button class="btn" id="d-new">${I.fold}Nuova cartella</button><button class="btn" id="d-ref">${I.ref}Aggiorna</button></div>`;
  $$("[data-c]", body).forEach(a => a.onclick = e => { e.preventDefault(); PCUR.sub = PCUR.sub.slice(0, +a.dataset.c); PCUR.files = null; tabDoc(p, body); });
  $("#d-ref", body).onclick = () => { PCUR.files = null; tabDoc(p, body); };
  $("#d-new", body).onclick = async () => {
    const n = safeName(await chiedi("Nuova cartella", "Nome della cartella", "", "Crea")); if (!n) return;
    try { await mkdir(parts, n); logPratica(p, `Cartella creata: ${[...PCUR.sub, n].join(" / ")}`, "file"); PCUR.files = null; tabDoc(p, body); toast("Cartella creata"); }
    catch (e) { toast(e.status === 409 ? "Esiste già una cartella con questo nome" : "Errore: " + e.message, true); }
  };
  const caricaFiles = async (files, foto) => {
    const prog = $("#d-prog", body); const nomi = [];
    for (let i = 0; i < files.length; i++) {
      let f = files[i], nome = safeName(f.name) || "file";
      if (foto || /^image\.(jpe?g|heic|png)$/i.test(nome)) { const d = new Date(), pad = x => String(x).padStart(2, "0"); nome = `Foto_${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}${files.length > 1 ? "_" + (i + 1) : ""}.${extOf(nome) || "jpg"}`; }
      prog.innerHTML = `<div class="hint">Carico ${esc(nome)} (${i + 1}/${files.length}) · ${fmtSize(f.size)}</div><div class="prog"><i id="d-pi"></i></div>`;
      try { const r = await upload([...parts, nome], f, x => { const b = $("#d-pi"); if (b) b.style.width = Math.round(x * 100) + "%"; }); nomi.push(r?.name || nome); }
      catch (e) { toast(`Non caricato ${nome}: ${e.message}`, true); }
    }
    prog.innerHTML = "";
    if (nomi.length) { toast(nomi.length === 1 ? `Caricato ${nomi[0]}` : `Caricati ${nomi.length} file`); logPratica(p, `Caricat${nomi.length === 1 ? "o" : "i"}: ${nomi.join(", ")}${PCUR.sub.length ? " in " + PCUR.sub.join(" / ") : ""}`, "upload"); PCUR.files = null; tabDoc(p, body); }
  };
  $("#d-cam", body).onchange = e => { const f = [...e.target.files]; e.target.value = ""; if (f.length) caricaFiles(f, true); };
  $("#d-up", body).onchange = e => { const f = [...e.target.files]; e.target.value = ""; if (f.length) caricaFiles(f, false); };
  try {
    if (!PCUR.files || Date.now() - PCUR.filesAt > 45 * 60e3 || PCUR.filesFor !== parts.join("/")) { PCUR.files = await gList(parts); PCUR.filesAt = Date.now(); PCUR.filesFor = parts.join("/"); }
  } catch (e) { $("#d-l", body).innerHTML = `<div class="empty">${e.status === 404 ? "Cartella non trovata su OneDrive" : "Errore: " + esc(e.message)}</div>`; return; }
  const L = PCUR.files.filter(x => !/^(desktop\.ini|_pratica\.json|thumbs\.db)$/i.test(x.name) && !x.name.startsWith("~$")).sort((a, b) => (!!b.folder - !!a.folder) || natCmp(a.name, b.name));
  const el = $("#d-l", body);
  el.innerHTML = L.length ? L.map((x, i) => {
    const th = x.thumbnails?.[0]?.small?.url || x.thumbnails?.[0]?.medium?.url;
    const [lab, col] = ICON_EXT[extOf(x.name.replace(/\.p7m$/i, "") || x.name)] || ICON_EXT[extOf(x.name)] || [extOf(x.name).slice(0, 4).toUpperCase() || "FILE", "#64748b"];
    const icon = x.folder ? `<span class="ic dir">${I.list.replace('stroke="currentColor"', 'stroke="#fff"')}</span>` : th && !/\.pdf$/i.test(x.name) ? `<span class="ic" style="background-image:url('${esc(th)}')"></span>` : `<span class="ic" style="background:${col}">${esc(lab)}</span>`;
    const info = x.folder ? `${x.folder.childCount ?? ""} elementi` : `${fmtSize(x.size)} · ${dataIt(x.lastModifiedDateTime)}`;
    const href = x.folder ? "#" : apribile(x.name) ? x["@microsoft.graph.downloadUrl"] : x.webUrl;
    return `<a class="fi" data-i="${i}" href="${esc(href || "#")}" ${x.folder ? "" : 'target="_blank" rel="noopener"'}>${icon}<span class="tx"><b>${esc(x.name)}</b><small>${esc(info)}</small></span><button class="mn" data-m="${i}">⋯</button></a>`;
  }).join("") : `<div class="empty">Cartella vuota</div>`;
  $$(".fi", el).forEach(a => a.onclick = e => {
    const x = L[+a.dataset.i];
    if (e.target.closest("[data-m]")) { e.preventDefault(); return menuFile(p, x, body); }
    if (x.folder) { e.preventDefault(); PCUR.sub = [...PCUR.sub, x.name]; PCUR.files = null; tabDoc(p, body); }
  });
}
function menuFile(p, x, body) {
  sheet(x.name, `${x.folder ? "" : `<a class="opt" href="${esc(x["@microsoft.graph.downloadUrl"] || "#")}" target="_blank" rel="noopener">${I.eye}Apri / scarica</a>`}
    <a class="opt" href="${esc(x.webUrl)}" target="_blank" rel="noopener">${I.ext}Apri in OneDrive</a>
    ${navigator.share && !x.folder ? `<button class="opt" data-a="sh">${I.up}Condividi…</button>` : ""}
    <button class="opt" data-a="ren">${I.edit}Rinomina</button>
    <button class="opt bad" data-a="del">${I.trash}Elimina</button>`, (bg, close) => {
    $$("a.opt", bg).forEach(a => a.addEventListener("click", () => setTimeout(close, 50)));
    const sh = $("[data-a=sh]", bg); if (sh) sh.onclick = async () => {
      close();
      try { toast("Preparo il file…"); const b = await (await fetch(x["@microsoft.graph.downloadUrl"])).blob(); const f = new File([b], x.name, { type: b.type || x.file?.mimeType || "application/octet-stream" });
        if (navigator.canShare && navigator.canShare({ files: [f] })) await navigator.share({ files: [f], title: x.name }); else await navigator.share({ title: x.name, url: x.webUrl }); }
      catch (e) { if (e.name !== "AbortError") toast("Condivisione non riuscita: " + e.message, true); }
    };
    $("[data-a=ren]", bg).onclick = async () => {
      close(); const n = safeName(await chiedi("Rinomina", "Nuovo nome", x.name, "Rinomina")); if (!n || n === x.name) return;
      try { await gRename(x.id, n); logPratica(p, `Rinominato: ${x.name} → ${n}`, "ren"); PCUR.files = null; tabDoc(p, body); toast("Rinominato"); }
      catch (e) { toast(e.status === 409 ? "Esiste già un file con questo nome" : "Errore: " + e.message, true); }
    };
    $("[data-a=del]", bg).onclick = async () => {
      close(); if (!(await conferma("Elimina", `Eliminare <b>${esc(x.name)}</b>? Resta recuperabile dal Cestino di OneDrive per 30 giorni.`, "Elimina", true))) return;
      try { await gDelete(x.id); logPratica(p, `Eliminato: ${x.name}`, "del"); PCUR.files = null; tabDoc(p, body); toast("Eliminato"); }
      catch (e) { toast("Errore: " + e.message, true); }
    };
  });
}

/* dati */
const CAMPI = [["committente", "Committente (cognome e nome)"], ["telefono", "Telefono", "tel"], ["email", "E-mail", "email"], ["cf", "Codice fiscale / P.IVA"], ["canale", "Canale / agenzia"], ["compenso", "Compenso concordato €", "decimal"],
  ["indirizzo", "Indirizzo"], ["comune", "Comune"], ["provincia", "Prov."], ["foglio", "Foglio"], ["mappale", "Mappale"], ["sub", "Sub."], ["categoria", "Categoria"], ["piano", "Piano / interno"],
  ["residenza", "Residenza"], ["nascitaLuogo", "Luogo di nascita"], ["nascitaData", "Data di nascita", "date"], ["descrizione", "Descrizione lavori", "area"], ["note", "Note", "area"]];
function tabDati(p, body) {
  const m = PCUR.meta || metaOf(p);
  const righe = CAMPI.filter(([k]) => m[k]).map(([k, l]) => `<dt>${esc(l.replace(/ \(.*\)/, ""))}</dt><dd>${k === "compenso" ? eur(num(m[k])) : k === "nascitaData" ? esc(dataIt(m[k])) : esc(m[k]).replace(/\n/g, "<br>")}</dd>`).join("");
  body.innerHTML = `<div class="card">${righe ? `<dl class="kv">${m.tipo ? `<dt>Tipo</dt><dd>${esc(m.tipo)}</dd>` : ""}${righe}${m.dataApertura ? `<dt>Aperta il</dt><dd>${esc(dataIt(m.dataApertura))}</dd>` : ""}</dl>` : `<div class="empty" style="padding:16px">Nessun dato nella scheda</div>`}</div>

/* ---------- lettura documenti con Gemini (chiave salvata solo su questo telefono) ---------- */
const NF_CAMPI = ["committente", "cf", "telefono", "email", "nascitaLuogo", "nascitaData", "residenza", "docTipo", "docNumero", "docRilascio", "docDataRilascio", "docScadenza", "indirizzo", "comune", "provincia", "foglio", "mappale", "sub", "categoria", "piano", "canale", "compenso", "descrizione"];
const NF_DEST = { identita: "Documenti cliente", codice_fiscale: "Documenti cliente", atto: "Documenti cliente", visura: "Catasto", planimetria: "Catasto", estratto_mappa: "Catasto", ape: "Documenti cliente", foto: "Foto", preventivo: "", altro: "Documenti cliente" };
const destDaNome = n => /\.(dwg|dxf|bak)$/i.test(n) ? "Disegni" : /visur|catast|planim|docfa|mapp|elaborato|fogl/i.test(n) ? "Catasto" : /preventiv/i.test(n) ? "" : /\.(jpe?g|png|heic|heif|webp)$/i.test(n) && !/identit|carta|\bci\b|\bcie\b|patente|passaporto|document|fronte|retro/i.test(n) ? "Foto" : "Documenti cliente";
const tmo = ms => { const c = new AbortController(); setTimeout(() => c.abort(), ms); return c.signal; };
const b64Of = async blob => { const u = new Uint8Array(await blob.arrayBuffer()); let s = ""; for (let i = 0; i < u.length; i += 32768) s += String.fromCharCode(...u.subarray(i, i + 32768)); return btoa(s); };
async function ridimensiona(f) {
  if (!/^image\/(jpeg|png|webp)/.test(f.type) || f.size < 1.5e6) return f;
  try { const bm = await createImageBitmap(f), k = Math.min(1, 2000 / Math.max(bm.width, bm.height)), c = document.createElement("canvas"); c.width = Math.round(bm.width * k); c.height = Math.round(bm.height * k); c.getContext("2d").drawImage(bm, 0, 0, c.width, c.height); return await new Promise(r => c.toBlob(x => r(x || f), "image/jpeg", .85)); } catch (e) { return f; }
}
async function chiaveGemini(forza) {
  let k = ls.get("ps_gkey", "");
  if (!k || forza) { k = (await chiedi("Chiave Gemini", "Incolla la chiave di Google AI Studio (la stessa dell'assistente sul PC)", k, "Salva")) || ""; if (k) ls.set("ps_gkey", k.trim()); }
  return k.trim();
}
async function geminiLeggi(items) {
  const key = await chiaveGemini(); if (!key) throw new Error("serve la chiave Gemini (Impostazioni ⚙)");
  const parts = [{ text: `Sei l'assistente di uno studio tecnico (perito edile). Ti mando i documenti per aprire una nuova pratica: documento d'identità, codice fiscale, visure, planimetrie, atti, preventivi. Estrai i dati e rispondi SOLO con un JSON con queste chiavi (stringa vuota se il dato manca):
{"file":[{"n":numero del file,"tipo":"identita|codice_fiscale|visura|planimetria|estratto_mappa|atto|preventivo|ape|foto|altro"}],
"committente":"COGNOME Nome del cliente","cf":"","telefono":"","email":"","nascitaLuogo":"","nascitaData":"AAAA-MM-GG","residenza":"via, civico, comune",
"docTipo":"Carta d'identità elettronica|Carta d'identità|Patente di guida|Passaporto","docNumero":"","docRilascio":"ente di rilascio","docDataRilascio":"AAAA-MM-GG","docScadenza":"AAAA-MM-GG",
"indirizzo":"via e civico dell'IMMOBILE","comune":"comune dell'immobile","provincia":"sigla","foglio":"","mappale":"","sub":"","categoria":"es. A/2","piano":"",
"canale":"agenzia o intermediario, se il preventivo è intestato a un'agenzia","compenso":"onorario imponibile del preventivo, solo il numero","descrizione":"lavori del preventivo, una opera per riga",
"tipoPratica":"uno tra ${TIPI.map(t => t[1]).join(", ")} se si capisce, altrimenti vuoto"}` }];
  let i = 0;
  for (const it of items) {
    i++; let f = it.file; const n = it.name.toLowerCase();
    const mime = f.type || (/\.pdf$/.test(n) ? "application/pdf" : /\.png$/.test(n) ? "image/png" : /\.hei[cf]$/.test(n) ? "image/heic" : /\.jpe?g$/.test(n) ? "image/jpeg" : "");
    if (!/^(image\/|application\/pdf)/.test(mime)) continue;
    f = await ridimensiona(f); if (f.size > 12e6) continue;
    parts.push({ text: `File ${i}: ${it.name}` }, { inline_data: { mime_type: f.type || mime, data: await b64Of(f) } });
  }
  if (parts.length < 2) return null;
  const body = JSON.stringify({ contents: [{ role: "user", parts }], generationConfig: { responseMimeType: "application/json", temperature: 0 } });
  for (const m of [...new Set([ls.get("ps_gmodel", "gemini-flash-latest"), "gemini-flash-latest", "gemini-2.5-flash", "gemini-2.0-flash"])]) {
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`, { method: "POST", headers: { "Content-Type": "application/json", "x-goog-api-key": key }, body, signal: tmo(80000) }).catch(e => { throw new Error(e.name === "AbortError" ? "Gemini non risponde: riprova con meno documenti per volta" : "connessione a Gemini non riuscita (" + e.message + ")"); });
    const j = await r.json().catch(() => ({}));
    if (r.status === 404) continue;
    if (r.status === 429) throw new Error("limite gratuito di Gemini raggiunto, riprova tra un minuto");
    if (!r.ok) { if (/api.?key|permission|unauth/i.test(j.error?.message || "") || r.status === 401 || r.status === 403) { ls.del("ps_gkey"); throw new Error("chiave Gemini non valida: reinseriscila"); } throw new Error(j.error?.message || "errore " + r.status); }
    ls.set("ps_gmodel", m);
    const t = (j.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("").replace(/^\s*```(json)?|```\s*$/g, "").trim();
    try { return JSON.parse(t); } catch (e) { throw new Error("risposta di Gemini non leggibile"); }
  }
  throw new Error("nessun modello Gemini disponibile");
}

let PV_F = "attesa";
async function viewPreventivi() {
  app().innerHTML = `<header class="hdr"><div class="row"><h1>Preventivi</h1><button class="ib" id="v-ref">${I.ref}</button></div><div class="sub">In attesa di conferma: quando il cliente accetta diventano una pratica</div></header>
    <div class="chips" id="v-f">${[["attesa", "In attesa"], ["accettato", "Accettati"], ["rifiutato", "Rifiutati"], ["", "Tutti"]].map(([k, l]) => `<button class="chip ${PV_F === k ? "on" : ""}" data-f="${k}">${l}</button>`).join("")}</div>
    <main><button class="btn gold full" id="v-new" style="margin-top:6px">${I.plus}Nuovo preventivo</button><div id="v-l"><div class="empty"><span class="spin"></span> Carico…</div></div></main>${tabbar("v")}`;
  wireTabbar();
  $$("#v-f [data-f]").forEach(b => b.onclick = () => { PV_F = b.dataset.f; $$("#v-f .chip").forEach(x => x.classList.toggle("on", x === b)); listaPrev(); });
  $("#v-new").onclick = () => editorPrev();
  $("#v-ref").onclick = async () => { await prevCarica().catch(e => toast(e.message, true)); listaPrev(); };
  if (!D.prev) { try { await prevCarica(); } catch (e) { $("#v-l").innerHTML = `<div class="warn">Non riesco a leggere i preventivi: ${esc(e.message)}</div>`; return; } }
  listaPrev();
}
function listaPrev() {
  const el = $("#v-l"); if (!el) return;
  const L = (D.prev || []).filter(x => !PV_F || x.stato === PV_F).sort((a, b) => (a.data < b.data ? 1 : -1));
  const att = (D.prev || []).filter(x => x.stato === "attesa");
  el.innerHTML = (PV_F === "attesa" && att.length ? `<div class="hint" style="margin:10px 4px 0">${att.length} in attesa · ${eur(att.reduce((s, x) => s + num(x.imponibile), 0))} di onorario in ballo</div>` : "") +
    (L.map(x => { const [lab, col] = PREV_ST[x.stato] || PREV_ST.attesa; const gg = x.stato === "attesa" && x.data ? Math.floor((Date.now() - Date.parse(x.data)) / 864e5) : null;
      return `<div class="pv" style="--sc:${col}" data-id="${esc(x.id)}"><div class="t"><b>${esc(x.numero)} · ${esc(x.dest || "—")}</b><b>${eur(x.totale || 0)}</b></div>
        <div class="s">${esc([x.tipo, x.comune, x.indirizzo].filter(Boolean).join(" · "))}${x.canale ? " · " + esc(x.canale) : ""}<br>${esc(lab)}${gg != null ? ` · ${gg === 0 ? "inviato oggi" : "da " + gg + " giorni"}` : x.pratica ? " · pratica " + esc(x.pratica) : ""}${x.daGenerare ? ' · <span style="color:#b45309">Word da creare sul PC</span>' : ""}</div>
        <div class="row2">${x.stato === "attesa" ? `<button class="btn pri" data-a="ok">${I.ok}Accettato</button><button class="btn" data-a="no">Rifiutato</button>` : x.stato === "accettato" && x.pratica ? `<button class="btn" data-a="vai">Apri pratica</button>` : `<button class="btn" data-a="riapri">Rimetti in attesa</button>`}
          ${x.file ? `<button class="btn" data-a="file">${I.eye}</button>` : ""}${x.telefono ? `<a class="btn" href="tel:${esc(x.telefono)}">${I.phone}</a>` : ""}</div></div>`; }).join("") || `<div class="empty">${(D.prev || []).length ? "Nessun preventivo con questo filtro" : "Nessun preventivo"}</div>`);
  $$(".pv", el).forEach(r => { const x = D.prev.find(y => y.id === r.dataset.id); $$("[data-a]", r).forEach(b => b.onclick = () => azionePrev(x, b.dataset.a)); });
}
async function azionePrev(x, a) {
  try {
    if (a === "ok") { if (!(await conferma("Preventivo accettato", `Apro <b>Nuova pratica</b> già compilata con i dati del preventivo <b>${esc(x.numero)}</b>.`, "Apri la pratica"))) return; NUOVA_PREF = x; location.hash = "#/nuova"; return; }
    if (a === "vai") { const p = D.prat.find(q => String(q.codice).toLowerCase() === String(x.pratica).toLowerCase()); if (!p) return toast("Pratica non trovata", true); location.hash = "#/p/" + encodeURIComponent(p.key); return; }
    if (a === "file") { const it = await gItem([...(x.cartella || ["_Preventivi", String(x.anno)]), x.file]); if (!it) return toast("File del preventivo non trovato", true); location.href = it.webUrl; return; }
    if (a === "no" || a === "riapri") { const st = a === "no" ? "rifiutato" : "attesa"; await prevModifica(L => { const y = L.find(z => z.id === x.id); if (y) { y.stato = st; y.statoData = oggi(); } }); listaPrev(); toast(`${x.numero}: ${PREV_ST[st][0].toLowerCase()}`); }
  } catch (e) { toast("Errore: " + e.message, true); }
}
function editorPrev() {
  const tc0 = "Ape"; const st = { voci: presetFor(catOf(tc0)) };
  sheet("Nuovo preventivo", `<div class="f"><label>Destinatario (cliente)</label><input id="pe-dest" autocapitalize="words"></div>
    <div class="g2"><div class="f"><label>Telefono</label><input id="pe-tel" type="tel"></div><div class="f"><label>E-mail</label><input id="pe-mail" type="email" autocapitalize="off"></div></div>
    <div class="f"><label>Canale / agenzia</label><input id="pe-can"></div>
    <div class="f"><label>Tipo pratica</label><select id="pe-tipo">${TIPI.map(([l, c]) => `<option value="${c}">${esc(l)}</option>`).join("")}</select></div>
    <div class="f"><label>Indirizzo immobile</label><input id="pe-ind"></div><div class="f"><label>Comune</label><input id="pe-com"></div>
    <div class="f"><label>Voci (descrizione e onorario €)</label></div><div id="pe-v"></div><button class="btn full" id="pe-add" style="margin-bottom:10px">${I.plus}Aggiungi voce</button>
    <div class="g2"><div class="f"><label>Regime</label><select id="pe-reg"><option value="forfettario">Forfettario</option><option value="ordinario">Ordinario (IVA 22%)</option></select></div><div class="f"><label>Cassa %</label><input id="pe-cassa" value="5" inputmode="decimal"></div></div>
    <div class="tot"><span>Totale</span><span id="pe-tot">€ 0</span></div>
    <p class="hint">Il preventivo resta tra quelli <b>in attesa</b>. Il documento Word si crea da solo la prossima volta che apri Pratiche Studio sul PC.</p>
    <div class="row2"><button class="btn" data-n>Annulla</button><button class="btn pri" data-y>${I.ok}Salva preventivo</button></div>`, (bg, close) => {
    const tot = () => { const c = calcPrev({ voci: st.voci, cassa: $("#pe-cassa", bg).value, regime: $("#pe-reg", bg).value }); $("#pe-tot", bg).textContent = eur(c.tot) + (c.imp ? ` (onorario ${eur(c.imp)})` : ""); };
    const draw = () => {
      $("#pe-v", bg).innerHTML = st.voci.map((v, i) => `<div class="voce" data-i="${i}"><input data-f="t" value="${esc(v.t)}" placeholder="Descrizione"><input data-f="imp" value="${esc(v.imp)}" inputmode="decimal" placeholder="€"><button data-rm>✕</button></div>`).join("");
      $$(".voce", bg).forEach(r => { const i = +r.dataset.i; $$("[data-f]", r).forEach(inp => inp.oninput = () => { st.voci[i][inp.dataset.f] = inp.value; tot(); }); $("[data-rm]", r).onclick = () => { st.voci.splice(i, 1); draw(); }; });
      tot();
    };
    $("#pe-tipo", bg).onchange = () => { st.voci = presetFor(catOf($("#pe-tipo", bg).value)); draw(); };
    $("#pe-add", bg).onclick = () => { st.voci.push({ t: "", d: "", imp: "" }); draw(); };
    $("#pe-reg", bg).onchange = tot; $("#pe-cassa", bg).oninput = tot;
    $("[data-n]", bg).onclick = close;
    $("[data-y]", bg).onclick = async () => {
      const dest = $("#pe-dest", bg).value.trim(); if (!dest) return toast("Scrivi il destinatario", true);
      const b = $("[data-y]", bg); b.disabled = true; b.innerHTML = `<span class="spin"></span> Salvo…`;
      const anno = new Date().getFullYear(), tc = $("#pe-tipo", bg).value;
      const x = { id: "pv" + Date.now().toString(36), anno, data: oggi(), dest, destInd: "", telefono: $("#pe-tel", bg).value.trim(), email: $("#pe-mail", bg).value.trim(), canale: $("#pe-can", bg).value.trim(),
        tipoCode: tc, tipo: (TIPI.find(t => t[1] === tc) || [""])[0], indirizzo: $("#pe-ind", bg).value.trim(), comune: $("#pe-com", bg).value.trim(), regime: $("#pe-reg", bg).value, cassa: $("#pe-cassa", bg).value,
        validita: "30", pagamento: "50% all'incarico, saldo alla consegna / al deposito", extra: "", voci: st.voci.filter(v => v.t || v.imp).map(v => ({ t: v.t || "", d: v.d || "", imp: v.imp ?? "" })), stato: "attesa", cartella: ["_Preventivi", String(anno)], file: "", daGenerare: true, daTelefono: true };
      const c = calcPrev(x); x.imponibile = Math.round(c.imp * 100) / 100; x.totale = Math.round(c.tot * 100) / 100;
      try { await prevModifica(L => { x.numero = prevNumero(L, anno); L.push(x); }); close(); PV_F = "attesa"; viewPreventivi(); toast(`Preventivo ${x.numero} salvato`); }
      catch (e) { toast("Non salvato: " + e.message, true); b.disabled = false; b.innerHTML = `${I.ok}Salva preventivo`; }
    };
    draw();
  });
}

/* ================= avvio e navigazione ================= */
function route() {
  const h = location.hash || "#/";
  let m;
  if ((m = /^#\/p\/(.+)$/.exec(h))) return viewPratica(decodeURIComponent(m[1]));
  if (h === "#/nuova") return viewNuova();
  if (h === "#/preventivi") return viewPreventivi();
  return viewLista();
}
async function avvio() {
  if (!CFG.clientId) return viewSetup();
  try { await handleRedirect(); } catch (e) { return viewLogin("Accesso non riuscito: " + e.message); }
  if (!TOK?.rt && !TOK?.at) return viewLogin();
  window.addEventListener("hashchange", route);
  const cache = ls.get("ps_cache", null); if (cache) applica(cache);
  route();
  await caricaTutto(!!cache);
  if (!location.hash.startsWith("#/p/") && location.hash !== "#/nuova") route();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && Date.now() - (window.__lastLoad || 0) > 5 * 60e3) { window.__lastLoad = Date.now(); caricaTutto(true).then(() => { if (!location.hash.startsWith("#/p/") && location.hash !== "#/nuova") route(); }); } });
  window.__lastLoad = Date.now();
}
avvio();
</script>
</body>
